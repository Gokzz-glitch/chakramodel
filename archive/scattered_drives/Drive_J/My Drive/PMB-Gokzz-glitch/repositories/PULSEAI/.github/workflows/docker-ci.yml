name: Docker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Build backend image
        run: docker build -t pulseai-backend-ci ./backend

      - name: Build frontend image
        run: docker build -t pulseai-frontend-ci ./frontend

      - name: Start backend for smoke test
        run: |
          docker run -d --name pulseai-backend-test -p 8000:8000 pulseai-backend-ci
          sleep 20
          curl --fail http://localhost:8000/health

      - name: Start frontend for smoke test
        run: |
          docker run -d --name pulseai-frontend-test -p 8080:80 pulseai-frontend-ci
          sleep 10
          curl --fail http://localhost:8080

      - name: Cleanup
        if: always()
        run: |
          docker rm -f pulseai-backend-test || true
          docker rm -f pulseai-frontend-test || true
