name: Deploy Explainer to GitHub Pages

on:
  push:
    branches: ["310624121022-star-aqi-prediction-dashboard"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Prepare site
        run: |
          mkdir -p _site
          cp aaam-explainer.html _site/index.html
          cp aaam-explainer.html _site/aaam-explainer.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
